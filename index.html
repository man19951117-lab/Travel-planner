<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🍑 岡山倉敷旅 | V6 最終版</title>
    
    <!-- 1. Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- 3. Leaflet Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <!-- 4. Firebase SDK (Modular) - Keeping the imports for completeness but decoupling app logic -->
    <script type="module">
        // 這些模組會嘗試在背景載入，但不會阻止主要應用程式的初始化。
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        window.firebaseModules = { initializeApp, getFirestore, doc, getDoc, setDoc, onSnapshot, updateDoc, getAuth, signInAnonymously };
    </script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #F9FAFB; overflow: hidden; }
        
        /* 自定義捲軸 */
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background-color: #CBD5E1; border-radius: 20px; }
        
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .hidden-opacity { opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .show-opacity { opacity: 1; pointer-events: auto; }
        
        .slide-up { animation: slideUp 0.4s forwards; opacity: 0; transform: translateY(10px); }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
        
        .card-active { border-color: #EC4899 !important; background-color: #FDF2F8 !important; }
        .cursor-pointer:hover { background-color: #F9FAFB; }

        /* 地圖數字樣式 */
        .number-icon {
            background-color: #DB2777; color: white; border: 2px solid white;
            border-radius: 50%; text-align: center; line-height: 24px;
            font-weight: bold; font-family: sans-serif; font-size: 14px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .number-icon-hotel { background-color: #4F46E5; }
        .number-icon-food { background-color: #F97316; }

        /* 編輯模式樣式 */
        .edit-controls { display: none; }
        .is-editing .edit-controls { display: flex; }
        .is-editing .view-controls { display: none; }
    </style>
</head>
<body class="h-[100dvh] flex flex-col relative text-gray-800">

    <!-- 1. Top Section: Header & Map (Fixed) -->
    <div class="flex-shrink-0 bg-white shadow-md z-20 relative">
        <header class="bg-gradient-to-r from-pink-500 to-rose-500 text-white px-4 py-3 flex justify-between items-center shadow-sm">
            <div class="flex items-center gap-2">
                <h1 class="text-lg font-black tracking-tight">🍑 岡山倉敷旅</h1>
                <div id="sync-status" class="w-2 h-2 rounded-full bg-green-400 animate-pulse" title="已同步"></div>
            </div>
            <div class="flex gap-2">
                <!-- NEW: Currency Converter Button -->
                <button onclick="openCurrencyModal()" class="bg-white/20 backdrop-blur-md p-2 rounded-full active:scale-95 transition" title="匯率試算">
                    <i data-lucide="calculator" class="w-4 h-4"></i>
                </button>
                <button onclick="shareTrip()" class="bg-white/20 backdrop-blur-md p-2 rounded-full active:scale-95 transition" title="分享行程">
                    <i data-lucide="share-2" class="w-4 h-4"></i>
                </button>
                <button onclick="toggleEditMode()" id="edit-btn" class="bg-white/20 backdrop-blur-md p-2 rounded-full active:scale-95 transition" title="編輯行程">
                    <i data-lucide="pencil" class="w-4 h-4"></i>
                </button>
            </div>
        </header>

        <div id="map" class="w-full h-[30vh] bg-gray-200 z-10 transition-all duration-300"></div>
        <div class="absolute bottom-2 right-2 z-[400] bg-white/90 backdrop-blur text-[10px] px-2 py-1 rounded shadow text-gray-500 pointer-events-none">
            地圖可縮放 • 點擊圖示定位
        </div>
    </div>

    <!-- 2. Bottom Section: Scrollable Content -->
    <div class="flex-1 overflow-hidden relative bg-gray-50">
        <!-- 裝飾用圓弧 -->
        <div class="absolute top-0 left-0 right-0 h-4 bg-gray-50 rounded-t-2xl -mt-4 z-20 pointer-events-none shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)]"></div>

        <div class="h-full overflow-y-auto custom-scroll pb-24 pt-2 px-4" id="scrollable-content">
            
            <!-- Day Info -->
            <div id="day-info-card" class="bg-white rounded-xl p-4 mb-4 shadow-sm border border-gray-100 flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <div class="animate-pulse h-4 w-16 bg-gray-100 rounded"></div>
                    <div class="animate-pulse h-6 w-32 bg-gray-100 rounded"></div>
                </div>
            </div>
            
            <!-- Timeline -->
            <div class="relative pb-safe">
                <div class="absolute left-[27px] top-2 bottom-0 w-0.5 bg-gray-200 -z-10"></div>
                <div id="timeline-events"></div>
                
                <!-- Add Button (Visible in Edit Mode) -->
                <div class="edit-controls mt-4 mb-8 justify-center">
                    <button onclick="openAddModal()" class="flex items-center gap-2 bg-pink-100 text-pink-600 px-6 py-3 rounded-full font-bold shadow-sm hover:bg-pink-200 active:scale-95 transition">
                        <i data-lucide="plus-circle" class="w-5 h-5"></i> 新增此日行程
                    </button>
                </div>

                <div class="flex flex-col items-center justify-center py-6 opacity-50 view-controls">
                    <span id="day-end-text" class="text-xs text-gray-400">Day 1 End</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Nav -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 pb-safe pt-2 px-2 shadow-[0_-5px_20px_rgba(0,0,0,0.05)] z-40 md:hidden">
        <div id="mobile-nav" class="flex justify-between items-center max-w-lg mx-auto"></div>
    </nav>
    <nav id="desktop-nav" class="hidden md:flex fixed left-0 top-0 bottom-0 w-20 bg-white border-r border-gray-200 flex-col items-center py-8 z-50">
        <div class="mb-8 text-2xl">🍑</div>
    </nav>

    <!-- Detail Modal -->
    <div id="modal" class="fixed inset-0 bg-black/50 z-[1000] flex items-center justify-center p-4 backdrop-blur-sm hidden-opacity" onclick="closeModal('modal')">
        <div class="bg-white rounded-3xl w-full max-w-xl max-h-[90vh] overflow-y-auto shadow-2xl transform scale-95 transition-transform duration-300" onclick="event.stopPropagation()">
            <div class="bg-pink-500 p-4 flex justify-between items-center text-white sticky top-0 z-10 rounded-t-3xl">
                <h3 id="modal-title" class="font-bold text-lg flex items-center"></h3>
                <button onclick="closeModal('modal')"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="p-6" id="modal-body-container">
                <div id="modal-body" class="text-gray-700"></div>
                <div id="modal-website-link" class="mt-6"></div>
                <button onclick="closeModal('modal')" class="w-full bg-pink-100 text-pink-600 font-bold py-3 rounded-xl hover:bg-pink-200 transition mt-6">關閉</button>
            </div>
        </div>
    </div>

    <!-- NEW: Currency Converter Modal -->
    <div id="currency-modal" class="fixed inset-0 bg-black/50 z-[1000] flex items-center justify-center p-4 backdrop-blur-sm hidden-opacity" onclick="closeModal('currency-modal')">
        <div class="bg-white rounded-3xl w-full max-w-sm max-h-[90vh] overflow-y-auto shadow-2xl transform scale-95 transition-transform duration-300" onclick="event.stopPropagation()">
            <div class="bg-pink-500 p-4 flex justify-between items-center text-white sticky top-0 z-10 rounded-t-3xl">
                <h3 class="font-bold text-lg flex items-center"><i data-lucide="calculator" class="w-5 h-5 mr-2"></i> 日圓兌台幣試算</h3>
                <button onclick="closeModal('currency-modal')"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="p-6">
                <div class="space-y-4">
                    <!-- 匯率設定 -->
                    <div class="bg-blue-50 p-3 rounded-xl border border-blue-200">
                        <label for="custom-rate-input" class="text-xs text-blue-700 font-bold flex items-center mb-1">
                            <i data-lucide="settings" class="w-3 h-3 mr-1"></i> 設定匯率 (1 JPY = ? TWD)
                        </label>
                        <div class="flex items-center gap-2">
                            <input type="number" id="custom-rate-input" step="0.001" min="0.01" class="w-24 p-2 bg-white rounded-lg border border-gray-200 focus:border-blue-500 outline-none text-sm" placeholder="0.20">
                            <button onclick="setCustomRate()" class="flex-1 bg-blue-500 text-white font-bold py-2 rounded-lg hover:bg-blue-600 transition text-sm">確認設定</button>
                        </div>
                    </div>

                    <!-- 試算器 -->
                    <div class="pt-4 border-t border-gray-100">
                        <h4 class="font-bold text-gray-700 mb-2">金額試算</h4>
                        <div class="flex items-center gap-2">
                            <input type="number" id="jpy-input" placeholder="日圓金額 (JPY)" class="flex-1 p-3 bg-gray-50 rounded-lg border border-gray-200 focus:border-pink-500 outline-none" oninput="convertCurrency()">
                            <i data-lucide="arrow-right" class="w-5 h-5 text-gray-400 flex-shrink-0"></i>
                        </div>
                        
                        <div id="twd-output" class="mt-3 p-3 bg-pink-50 rounded-lg border border-pink-200 font-black text-pink-700 text-center text-xl">0 TWD</div>
                    </div>
                </div>

                <p id="exchange-rate-info" class="text-xs text-gray-500 mt-4 text-center">當前匯率：1 JPY ≈ <span id="display-rate">0.200</span> TWD</p>
                <button onclick="closeModal('currency-modal')" class="w-full bg-pink-100 text-pink-600 font-bold py-3 rounded-xl hover:bg-pink-200 transition mt-6">關閉</button>
            </div>
        </div>
    </div>

    <!-- Add/Edit Event Modal -->
    <div id="add-modal" class="fixed inset-0 bg-black/50 z-[1000] flex items-end sm:items-center justify-center sm:p-4 backdrop-blur-sm hidden-opacity" onclick="closeModal('add-modal')">

                <button onclick="closeModal('add-modal')"><i data-lucide="x" class="w-5 h-5 text-gray-500"></i></button>
            </div>

                </div>

                    <input type="text" id="new-title" placeholder="例如：倉敷美觀地區" class="w-full p-3 bg-gray-50 rounded-xl border border-gray-200 focus:border-pink-500 outline-none">
                </div>
                <div>
                    <label class="text-xs text-gray-500 font-bold">地點名稱 (用於導航)</label>

                </div>
                <div class="flex gap-2">
                    <div class="flex-1">
                        <label class="text-xs text-gray-500 font-bold">類型</label>

                            <option value="shopping">購物</option>

                    </div>
                </div>

                 <div>
                    <label class="text-xs text-gray-500 font-bold">詳細筆記 (交通/注意事項)</label>
                    <textarea id="new-details" rows="3" placeholder="例如：營業時間, 門票, 轉乘資訊" class="w-full p-3 bg-gray-50 rounded-xl border border-gray-200 focus:border-pink-500 outline-none"></textarea>

                    <input type="url" id="new-website" placeholder="https://..." class="w-full p-3 bg-gray-50 rounded-xl border border-gray-200 focus:border-pink-500 outline-none">
                </div>
                <button onclick="submitNewEvent()" class="w-full bg-pink-500 text-white font-bold py-3 rounded-xl hover:bg-pink-600 shadow-lg shadow-pink-200 transition">確認新增</button>
            </div>
        </div>
    </div>

        // --- Init & Core Logic (Updated) ---
        document.addEventListener('DOMContentLoaded', initAppLogic);

        function initAppLogic() {
            const params = new URLSearchParams(window.location.search);
            currentTripId = params.get('tripId');
            if (!currentTripId) {
                currentTripId = generateId();
                const newUrl = `${window.location.pathname}?tripId=${currentTripId}`;
                window.history.replaceState(null, '', newUrl);
                currentData = getDefaultData();
                saveData(); 
            } else {
                loadData();
            }

            loadRate(); // Load custom rate from storage
            renderNav();
            renderCurrentDay();

            window.addEventListener('storage', (e) => {
                if (e.key === `trip_${currentTripId}`) {
                    loadData();
                    renderCurrentDay();
                    showToast('行程已同步更新', 'blue');
                }
            });
        }
        
        // --- Currency Converter Logic (New) ---
        function loadRate() {
            const storedRate = localStorage.getItem('customExchangeRate');
            if (storedRate) {
                currentExchangeRate = parseFloat(storedRate);
            }
        }

        function saveRate(rate) {
            currentExchangeRate = parseFloat(rate);
            localStorage.setItem('customExchangeRate', currentExchangeRate);
        }

        function openCurrencyModal() {
            loadRate(); // Ensure the latest rate is loaded
            
            // Set the current rate in the input field
            const rateInput = document.getElementById('custom-rate-input');
            if (rateInput) {
                 rateInput.value = currentExchangeRate.toFixed(3);
            }
            
            // Clear JPY input and output on open
            const jpyInput = document.getElementById('jpy-input');
            const twdOutput = document.getElementById('twd-output');
            if(jpyInput) jpyInput.value = '';
            if(twdOutput) twdOutput.innerText = '0 TWD';
            
            // Update display rate text
            convertCurrency(); 
            
            document.getElementById('currency-modal').classList.remove('hidden-opacity');
            lucide.createIcons();
        }

        function setCustomRate() {
            const rateInput = document.getElementById('custom-rate-input');
            let newRate = parseFloat(rateInput.value);
            
            if (isNaN(newRate) || newRate <= 0.01) {
                newRate = 0.20; // Fallback to default
                rateInput.value = newRate.toFixed(3);
            }
            
            saveRate(newRate);
            convertCurrency(); // Recalculate if JPY input has value and update display
            showToast(`匯率已更新為 1 JPY ≈ ${newRate.toFixed(3)} TWD`, 'blue');
        }

        function convertCurrency() {
            const jpyInput = document.getElementById('jpy-input');
            const twdOutput = document.getElementById('twd-output');
            const displayRateEl = document.getElementById('display-rate');
            
            // Update rate display in the modal footer
            if (displayRateEl) {
                displayRateEl.innerText = currentExchangeRate.toFixed(3);
            }

            if (!jpyInput || !twdOutput) return;

            const jpy = parseFloat(jpyInput.value);
            
            if (isNaN(jpy) || jpy <= 0) {
                twdOutput.innerText = '0 TWD';
                return;
            }
            
            const twd = (jpy * currentExchangeRate).toFixed(1);
            twdOutput.innerText = `${twd} TWD`;
        }

            if (stored) {
                try {
                    currentData = JSON.parse(stored);
                } catch(e) {
                    currentData = getDefaultData();
                    saveData(); 
                    console.error("Failed to parse stored data, using default.", e);

            } else {

                saveData();
            }

        // --- Editing Logic ---
        function toggleEditMode() {
            isEditMode = !isEditMode;

                btn.classList.add('bg-pink-500', 'text-white');
                btn.classList.remove('bg-white/20');

        function moveEvent(index, direction) {
            const events = currentData[currentDay].events;
            if (direction === -1 && index > 0) {
                [events[index], events[index - 1]] = [events[index - 1], events[index]];
            } else if (direction === 1 && index < events.length - 1) {
                [events[index], events[index + 1]] = [events[index + 1], events[index]];
            }
            saveData();
            renderCurrentDay();
        }

        function deleteEvent(index) {
            // Replaced window.confirm with a simpler check for demo purposes
            if (confirm('確定要刪除這個行程嗎？')) {
                currentData[currentDay].events.splice(index, 1);
                saveData();
                renderCurrentDay();
                showToast("行程已刪除", 'red');
            }
        }

            document.getElementById('add-modal').classList.remove('hidden-opacity');

            document.getElementById('new-time').value = new Date().toTimeString().slice(0, 5); 
            document.getElementById('new-title').value = "";
            document.getElementById('new-location').value = "";
            document.getElementById('new-info-summary').value = "";
            document.getElementById('new-details').value = "";
            document.getElementById('new-website').value = "";

        function submitNewEvent() {
            const time = document.getElementById('new-time').value;
            const title = document.getElementById('new-title').value;
            const type = document.getElementById('new-type').value;
            const loc = document.getElementById('new-location').value;
            const infoSummary = document.getElementById('new-info-summary').value;
            const details = document.getElementById('new-details').value;
            const website = document.getElementById('new-website').value;

            if(!title || !time) { showToast('時間與標題為必填欄位', 'red'); return; }

            // Create new event object
            const newEvent = {
                time: time,
                title: title,
                type: type,
                location: loc || title,
                infoSummary: infoSummary || '無簡述',
                transportDetails: details, 
                notes: details,
                website: website,
                coords: null // 新增的點無法自動定位，保持為 null
            };

            currentData[currentDay].events.push(newEvent);
            currentData[currentDay].events.sort((a, b) => a.time.localeCompare(b.time));
            
            saveData();
            closeModal('add-modal');
            renderCurrentDay();
            showToast("新增行程成功");
            
            const container = document.getElementById('scrollable-content');
            setTimeout(() => { container.scrollTop = container.scrollHeight; }, 100);
        }

        // --- Sharing & Toast (Unchanged) ---
        function shareTrip() {
            const url = window.location.href;
            const finalUrl = url.includes('tripId') ? url : `${url}?tripId=${currentTripId}`;

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(finalUrl).then(() => {
                    showToast('連結已複製！傳給朋友即可同步');
                }).catch(() => {
                    fallbackCopyTextToClipboard(finalUrl);
                });
            } else {
                fallbackCopyTextToClipboard(finalUrl);
            }
        }

        function fallbackCopyTextToClipboard(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed"; 
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();

            try {
                document.execCommand('copy');
                showToast('連結已複製！傳給朋友即可同步');
            } catch (err) {
                showToast('複製失敗，請手動複製網址', 'red');
            }
            document.body.removeChild(textArea);
        }

        function showToast(msg, color = 'green') {
            const toast = document.createElement('div');
            const colorMap = {
                green: 'bg-green-500', blue: 'bg-blue-500', red: 'bg-red-500'
            };
            toast.className = `fixed bottom-20 left-1/2 transform -translate-x-1/2 ${colorMap[color]} text-white px-4 py-2 rounded-full text-sm shadow-lg z-[1000] transition duration-300 opacity-0`;
            toast.innerText = msg;
            document.body.appendChild(toast);
            
            setTimeout(() => { toast.classList.remove('opacity-0'); toast.classList.add('opacity-100'); }, 10);
            
            setTimeout(() => { 
                toast.classList.remove('opacity-100'); 
                toast.classList.add('opacity-0'); 
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

                    const icon = L.divIcon({
                        className: 'custom-div-icon',
                        html: `<div class="${cssClass}">${counter}</div>`,
                        iconSize: [24, 24], iconAnchor: [12, 12]
                    });
                    
                    const marker = L.marker(event.coords, { icon: icon, numberId: counter }).addTo(mapInstance)
                        .bindPopup(`<div class="text-center font-sans text-sm"><b>${counter}. ${event.title}</b></div>`);
                    
                    marker.on('click', () => {
                        const card = document.getElementById(`card-${counter}`);
                        if(card) {
                            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            highlightCard(card);
                        }
                    });
                    mapMarkers.push(marker);
                }
            });
            
            if (coords.length > 0) {
                mapInstance.fitBounds(coords, { padding: [40, 40] });
            } else {
                 mapInstance.setView([34.666, 133.918], 12);
            }
        }

        function focusOnMap(lat, lng, numberId, cardElement) {
            if (mapInstance) {
                mapInstance.flyTo([lat, lng], 15, { duration: 1.0 });
                const targetMarker = mapMarkers.find(m => m.options.numberId === numberId);
                if (targetMarker) targetMarker.openPopup();
                highlightCard(cardElement);
            }
        }

        function highlightCard(el) {
            document.querySelectorAll('#timeline-events > div > div:nth-child(3)').forEach(c => c.classList.remove('card-active'));
            if (el) {
               el.classList.add('card-active');
               setTimeout(() => { el.classList.remove('card-active'); }, 1500);
            }
        }

        // --- Helpers (Unchanged) ---
        function renderNav() {
            const labels = ["抵達", "遊玩", "移動", "遊玩", "返程"];
            const mobileNavHtml = [1,2,3,4,5].map((d, i) => `
                <button onclick="loadDay(${d})" class="nav-btn w-full py-2 flex flex-col items-center justify-center transition-all duration-300 ${d===currentDay ? 'text-pink-500 -translate-y-1' : 'text-gray-400'}" data-day="${d}">
                    <div class="w-10 h-10 rounded-xl flex items-center justify-center mb-1 font-bold ${d===currentDay ? 'bg-pink-100' : ''}">D${d}</div>
                    <span class="text-[10px] font-medium ${d===currentDay ? 'opacity-100' : 'opacity-0'}">${labels[i]}</span>
                </button>
            `).join('');
            document.getElementById('mobile-nav').innerHTML = mobileNavHtml;
            
            const deskHtml = [1,2,3,4,5].map(d => `
                <button onclick="loadDay(${d})" class="w-12 h-12 mb-4 rounded-xl flex items-center justify-center transition-all ${d===currentDay ? 'bg-pink-500 text-white shadow-lg' : 'text-gray-400 hover:bg-gray-100'}">D${d}</button>
            `).join('');
            document.getElementById('desktop-nav').innerHTML = `<div class="mb-8 text-2xl">🍑</div>` + deskHtml;
        }

        function closeModal(id) { 
            const modal = document.getElementById(id);
            modal.classList.add('hidden-opacity'); 
            // 由於 transform scale 設置在 modal 內層，這裡確保動畫可以正常反轉
            const content = modal.querySelector('div:nth-child(2)');
            if (content && id === 'add-modal') {
                 // The translate-y-10 is for mobile bottom-up animation.
                 content.classList.add('translate-y-10', 'sm:translate-y-0');
            }
            if (content && (id === 'modal' || id === 'currency-modal')) {
                 content.classList.add('scale-95');
            }
        }
        
    </script>
</body>
</html>
